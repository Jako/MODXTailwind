[project]
site_name = "MODXTailwind"
site_description = "Documentation for MODXTailwind, the Webpack 5 workflow for developing MODX templates using Tailwind CSS 3."
site_author = "Treehill Studio"
repo_name = "Jako/MODXTailwind"
repo_url = "https://github.com/Jako/MODXTailwind"
edit_uri = "tree/master/docs/en/docs"
copyright = """
&copy; 2022 <a href="https://treehillstudio.com">Treehill Studio</a>
"""
nav = [
    { "Description" = "index.md" },
    { "Installation" = "installation.md" },
    { "Usage" = "usage.md" },
    { "Contributors" = "contributors.md" },
]
extra_css = ["assets/stylesheets/treehillstudio.css"]

[project.theme]
custom_dir = "/Users/jako/Documents/MODX/Zensical/TreehillStudio"
favicon = "assets/favicon.png"
language = "en"
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tooltips",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "green"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra.analytics]
provider = "matomo"
url = "matomo.treehillstudio.com"
site = 40

[[project.extra.social]]
name = "Jako on GitHub"
icon = "fontawesome/brands/github"
link = "https://github.com/Jako"

[project.markdown_extensions.attr_list]

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.footnotes]

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]

[project.markdown_extensions.zensical.extensions.glightbox]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]
